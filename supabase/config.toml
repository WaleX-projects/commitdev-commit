# Partial config: merge into the file generated by `supabase init`.
project_id = "commitdev"

[auth]
site_url = "http://127.0.0.1:3000"
# The CLI receives the OAuth code on a loopback server (COMMITDEV_CALLBACK_PORT, default 8976)
additional_redirect_urls = ["http://127.0.0.1:8976/callback"]

[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"

[functions.github-webhook]
verify_jwt = false   # GitHub can't send a Supabase JWT; the HMAC signature is verified instead

[functions.generate-draft]
verify_jwt = true

[functions.connect]
verify_jwt = true

[functions.publish-draft]
verify_jwt = true
